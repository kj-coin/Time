<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1119">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>TimeScroll</title>
<style>
  :root{
    --bg:#0d1119; --panel:#161c28; --panel2:#1e2635; --border:#2a3446;
    --text:#e8ecf3; --muted:#8a97ab; --accent:#f0b429;
    --good:#43d17a; --fringe:#f5943b; --night:#5b6bd6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--ui);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px;min-height:100%}

  /* Header / reference time */
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

  .refcard{
    background:linear-gradient(160deg,var(--panel),#121826);
    border:1px solid var(--border); border-radius:18px; padding:16px 18px 14px;
    touch-action:pan-y; user-select:none; cursor:ew-resize; position:relative; overflow:hidden;
  }
  .refcard::after{content:"drag to scrub ↔";position:absolute;right:14px;bottom:10px;font-size:10px;color:var(--muted);opacity:.6;letter-spacing:.05em}
  .reftime{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .refmeta{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .refdate{color:var(--muted);font-size:14px}
  .nowchip{
    font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;
    border:1px solid var(--accent);color:var(--accent);background:var(--panel2);cursor:pointer
  }
  .nowchip.live{color:#0d1119;background:var(--accent);border-color:var(--accent)}
  .offset{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--accent)}

  /* Scrub controls */
  .scrub{margin:12px 2px 4px}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:34px;background:transparent;margin:0
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:6px;
    background:linear-gradient(90deg,var(--night),var(--good) 50%,var(--fringe));
    opacity:.7
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;margin-top:-11px;width:28px;height:28px;border-radius:50%;
    background:var(--accent);border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.5)
  }
  .steps{display:flex;gap:6px;margin-top:8px}
  .steps button{
    flex:1;padding:9px 0;border-radius:11px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:13px;font-weight:600
  }
  .steps button.now{background:var(--panel2);border-color:var(--accent);color:var(--accent);font-weight:700}
  .steps button:active{background:var(--panel2)}

  /* City rows */
  .rows{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .row{
    display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden
  }
  .row .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .bar.good{background:var(--good)} .bar.fringe{background:var(--fringe)} .bar.night{background:var(--night)}
  .city{flex:1;min-width:0}
  .city .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .city .sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
  .rt{text-align:right}
  .rt .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;line-height:1}
  .rt .d{font-size:11px;color:var(--muted);margin-top:3px}
  .rt .d.next{color:var(--fringe)} .rt .d.prev{color:var(--night)}
  .row.here{background:linear-gradient(100deg,rgba(240,180,41,.10),var(--panel));border-color:rgba(240,180,41,.45)}
  .tag{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 4px;vertical-align:middle;margin-left:5px}
  .del{margin-left:2px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:16px;display:none;align-items:center;justify-content:center}
  body.editing .del{display:flex}
  body.editing .refcard::after{content:""}

  /* Bottom action bar */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 70%,transparent);display:flex;gap:8px;max-width:560px;margin:0 auto
  }
  .actionbar button{
    flex:1;padding:13px 0;border-radius:13px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:14px;font-weight:600
  }
  .actionbar button.primary{background:var(--accent);color:#0d1119;border-color:var(--accent)}

  /* Sheets */
  .sheet{
    position:fixed;inset:0;background:rgba(5,8,13,.6);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;z-index:20
  }
  .sheet.open{display:flex}
  .panel{
    width:100%;max-width:560px;margin:0 auto;background:var(--panel);
    border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto
  }
  .panel h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .sheet input[type=text],.sheet select,.sheet input[type=date],.sheet input[type=time]{
    width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:16px;font-family:var(--ui)
  }
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px;letter-spacing:.06em;text-transform:uppercase}
  .two{display:flex;gap:9px}.two>div{flex:1}
  .results{margin-top:6px;max-height:46vh;overflow:auto}
  .opt{padding:12px 6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .opt:active{background:var(--panel2)}
  .opt .oc{font-size:15px} .opt .os{font-size:11px;color:var(--muted)}
  .opt .oz{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .convout{
    background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:4px
  }
  .convout .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600}
  .convout .lbl{font-size:12px;color:var(--muted);margin-top:5px}
  .convout .from{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .rowbtns{display:flex;gap:8px;margin-top:14px}
  .rowbtns button{flex:1;padding:13px 0;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:600;font-size:14px}
  .rowbtns button.primary{background:var(--accent);color:#0d1119;border-color:var(--accent)}
  .close{float:right;color:var(--muted);font-size:22px;line-height:1;background:none;border:none;padding:0;margin-top:-4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>TimeScroll</h1><span class="dot"></span></div>

  <div class="refcard" id="refcard">
    <div class="reftime" id="reftime">--:--</div>
    <div class="refmeta">
      <span class="refdate" id="refdate">—</span>
      <span class="nowchip live" id="nowchip">LIVE</span>
      <span class="offset" id="offset"></span>
    </div>
  </div>

  <div class="scrub">
    <input type="range" id="scrub" min="-4320" max="4320" step="15" value="0">
    <div class="steps">
      <button data-step="-1440">−1d</button>
      <button data-step="-60">−1h</button>
      <button class="now" id="nowbtn">Now</button>
      <button data-step="60">+1h</button>
      <button data-step="1440">+1d</button>
    </div>
  </div>

  <div class="rows" id="rows"></div>
</div>

<div class="actionbar">
  <button id="addBtn">+ Add city</button>
  <button id="convBtn">Convert</button>
  <button id="editBtn">Edit</button>
</div>

<!-- Add city sheet -->
<div class="sheet" id="addSheet">
  <div class="panel">
    <button class="close" data-close>×</button>
    <h2>Add a city</h2>
    <div class="field"><input type="text" id="search" placeholder="Search city, country or zone…" autocomplete="off"></div>
    <div class="results" id="searchResults"></div>
  </div>
</div>

<!-- Converter sheet -->
<div class="sheet" id="convSheet">
  <div class="panel">
    <button class="close" data-close>×</button>
    <h2>Convert a time</h2>
    <div class="field">
      <label>From this zone</label>
      <select id="cFrom"></select>
    </div>
    <div class="two">
      <div class="field"><label>Date</label><input type="date" id="cDate"></div>
      <div class="field"><label>Time</label><input type="time" id="cTime"></div>
    </div>
    <div class="field">
      <label>To this zone</label>
      <select id="cTo"></select>
    </div>
    <div class="convout">
      <div class="big" id="cResult">—</div>
      <div class="lbl" id="cResultLbl"></div>
      <div class="from" id="cFromLbl"></div>
    </div>
    <div class="rowbtns">
      <button class="primary" id="cSend">Send to scroller</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- City database (IANA zones, offline) ---------- */
const ZONES = [
  ["Seoul","South Korea","Asia/Seoul"],["Busan","South Korea","Asia/Seoul"],
  ["Tokyo","Japan","Asia/Tokyo"],["Osaka","Japan","Asia/Tokyo"],
  ["Beijing","China","Asia/Shanghai"],["Shanghai","China","Asia/Shanghai"],
  ["Hong Kong","Hong Kong","Asia/Hong_Kong"],["Taipei","Taiwan","Asia/Taipei"],
  ["Singapore","Singapore","Asia/Singapore"],["Kuala Lumpur","Malaysia","Asia/Kuala_Lumpur"],
  ["Bangkok","Thailand","Asia/Bangkok"],["Jakarta","Indonesia","Asia/Jakarta"],
  ["Manila","Philippines","Asia/Manila"],["Ho Chi Minh City","Vietnam","Asia/Ho_Chi_Minh"],
  ["Delhi","India","Asia/Kolkata"],["New Delhi","India","Asia/Kolkata"],
  ["Mumbai","India","Asia/Kolkata"],["Bengaluru","India","Asia/Kolkata"],
  ["Chennai","India","Asia/Kolkata"],["Hyderabad","India","Asia/Kolkata"],
  ["Kolkata","India","Asia/Kolkata"],["Pune","India","Asia/Kolkata"],
  ["Dhaka","Bangladesh","Asia/Dhaka"],["Karachi","Pakistan","Asia/Karachi"],
  ["Dubai","UAE","Asia/Dubai"],["Abu Dhabi","UAE","Asia/Dubai"],
  ["Riyadh","Saudi Arabia","Asia/Riyadh"],["Tehran","Iran","Asia/Tehran"],
  ["Jerusalem","Israel","Asia/Jerusalem"],["Istanbul","Turkey","Europe/Istanbul"],
  ["Moscow","Russia","Europe/Moscow"],["Athens","Greece","Europe/Athens"],
  ["Cairo","Egypt","Africa/Cairo"],["Johannesburg","South Africa","Africa/Johannesburg"],
  ["Nairobi","Kenya","Africa/Nairobi"],["Lagos","Nigeria","Africa/Lagos"],
  ["Helsinki","Finland","Europe/Helsinki"],["Kyiv","Ukraine","Europe/Kyiv"],
  ["Berlin","Germany","Europe/Berlin"],["Paris","France","Europe/Paris"],
  ["Madrid","Spain","Europe/Madrid"],["Rome","Italy","Europe/Rome"],
  ["Amsterdam","Netherlands","Europe/Amsterdam"],["Zurich","Switzerland","Europe/Zurich"],
  ["Stockholm","Sweden","Europe/Stockholm"],["Warsaw","Poland","Europe/Warsaw"],
  ["London","United Kingdom","Europe/London"],["Dublin","Ireland","Europe/Dublin"],
  ["Lisbon","Portugal","Europe/Lisbon"],["Reykjavik","Iceland","Atlantic/Reykjavik"],
  ["São Paulo","Brazil","America/Sao_Paulo"],["Buenos Aires","Argentina","America/Argentina/Buenos_Aires"],
  ["Santiago","Chile","America/Santiago"],["Bogotá","Colombia","America/Bogota"],
  ["Lima","Peru","America/Lima"],["Mexico City","Mexico","America/Mexico_City"],
  ["New York","USA","America/New_York"],["Washington DC","USA","America/New_York"],
  ["Toronto","Canada","America/Toronto"],["Chicago","USA","America/Chicago"],
  ["Denver","USA","America/Denver"],["Phoenix","USA","America/Phoenix"],
  ["Los Angeles","USA","America/Los_Angeles"],["San Francisco","USA","America/Los_Angeles"],
  ["Seattle","USA","America/Los_Angeles"],["Vancouver","Canada","America/Vancouver"],
  ["Anchorage","USA","America/Anchorage"],["Honolulu","USA","Pacific/Honolulu"],
  ["Sydney","Australia","Australia/Sydney"],["Melbourne","Australia","Australia/Melbourne"],
  ["Brisbane","Australia","Australia/Brisbane"],["Perth","Australia","Australia/Perth"],
  ["Auckland","New Zealand","Pacific/Auckland"],["Wellington","New Zealand","Pacific/Auckland"],
  ["Fiji","Fiji","Pacific/Fiji"],["Guam","Guam","Pacific/Guam"],["UTC","Coordinated","UTC"]
];

/* ---------- Time helpers ---------- */
function partsIn(date, tz){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
    weekday:"short",year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const o={}; for(const p of f.formatToParts(date)) o[p.type]=p.value;
  let h=parseInt(o.hour,10); if(h===24) h=0;
  return {weekday:o.weekday,month:o.month,day:parseInt(o.day,10),year:parseInt(o.year,10),
          hour:h,minute:o.minute};
}
function offsetMinutes(ts, tz){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const o={}; for(const p of f.formatToParts(new Date(ts))) o[p.type]=p.value;
  let h=parseInt(o.hour,10); if(h===24) h=0;
  const asUTC=Date.UTC(+o.year,+o.month-1,+o.day,h,+o.minute,+o.second);
  return Math.round((asUTC-ts)/60000);
}
function wallToInstant(y,mo,d,h,mi,tz){
  const guess=Date.UTC(y,mo-1,d,h,mi);
  const o1=offsetMinutes(guess,tz); let ts=guess-o1*60000;
  const o2=offsetMinutes(ts,tz); if(o2!==o1) ts=guess-o2*60000;
  return ts;
}
function zoneAbbr(ts,tz){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"}).formatToParts(new Date(ts));
  const z=p.find(x=>x.type==="timeZoneName"); return z?z.value:"";
}
function tod(hour){ // time-of-day / call suitability tier
  if(hour>=9 && hour<18) return "good";
  if((hour>=7&&hour<9)||(hour>=18&&hour<22)) return "fringe";
  return "night";
}
const cityName = tz => { const z=ZONES.find(z=>z[2]===tz); return z?z[0]:tz; };
const cityMeta = tz => { const z=ZONES.find(z=>z[2]===tz); return z?z[1]:""; };

/* ---------- State ---------- */
const DEFAULTS=["Asia/Seoul","America/New_York","America/Los_Angeles","Europe/London","Asia/Shanghai"];
function load(){ try{const v=JSON.parse(localStorage.getItem("ts_cities"));
  if(Array.isArray(v)&&v.length) return v;}catch(e){} return DEFAULTS.slice(); }
function save(){ try{localStorage.setItem("ts_cities",JSON.stringify(myTZs));}catch(e){} }
let myTZs = load();
let mode="live";          // "live" | "fixed"
let fixedBase=Date.now(); // used when mode==="fixed"
let offset=0;             // minutes

function baseNow(){ return mode==="live" ? Date.now() : fixedBase; }
function refTime(){ return baseNow() + offset*60000; }

/* ---------- Rendering ---------- */
const $=id=>document.getElementById(id);
function fmtOffset(min){
  if(min===0) return "";
  const s=min<0?"−":"+"; let m=Math.abs(min);
  const d=Math.floor(m/1440); m%=1440; const h=Math.floor(m/60); m%=60;
  let out=s; if(d)out+=d+"d "; if(h||d)out+=h+"h "; out+=m+"m";
  return out.trim();
}
function render(){
  const ref=refTime();
  // The top / reference is the viewer's OWN timezone (auto-detected), live by default.
  const devTZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
  const home=partsIn(new Date(ref), devTZ);
  const homeName=(cityName(devTZ)!==devTZ)?cityName(devTZ):devTZ.split("/").pop().replace(/_/g," ");
  $("reftime").textContent=String(home.hour).padStart(2,"0")+":"+home.minute;
  $("refdate").textContent=home.weekday+", "+home.month+" "+home.day+" · "+homeName;
  $("offset").textContent=fmtOffset(offset);
  const live = (mode==="live" && offset===0);
  $("nowchip").textContent = live ? "LIVE" : "↺ NOW";
  $("nowchip").classList.toggle("live",live);

  const rows=$("rows"); rows.innerHTML="";

  myTZs.forEach(tz=>{
    const p=partsIn(new Date(ref),tz);
    const tier=tod(p.hour);
    const key=p.year+"-"+p.month+"-"+p.day;
    let dcls=""; 
    // compare calendar day vs home city
    const cmp=dayCompare(p, home);
    if(cmp>0) dcls="next"; else if(cmp<0) dcls="prev";
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=
      '<div class="bar '+tier+'"></div>'+
      '<div class="city"><div class="name">'+cityName(tz)+'</div>'+
        '<div class="sub">'+cityMeta(tz)+'</div></div>'+
      '<div class="rt"><div class="t">'+String(p.hour).padStart(2,"0")+":"+p.minute+'</div>'+
        '<div class="d '+dcls+'">'+p.weekday+" "+p.month+" "+p.day+'</div></div>'+
      '<button class="del" data-tz="'+tz+'">×</button>';
    rows.appendChild(row);
  });
  $("scrub").value=offset;
}
function dayCompare(a,b){ // +1 if a is a later calendar day than b, -1 earlier, 0 same
  if(a.year!==b.year) return a.year>b.year?1:-1;
  const mi=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const am=mi.indexOf(a.month), bm=mi.indexOf(b.month);
  if(am!==bm) return am>bm?1:-1;
  if(a.day!==b.day) return a.day>b.day?1:-1;
  return 0;
}

/* ---------- Scrub interactions ---------- */
function setOffset(v){
  if(mode==="live"){ fixedBase=Date.now(); mode="fixed"; } // freeze base when scrubbing off "now"
  offset=Math.max(-4320,Math.min(4320,Math.round(v)));
  render();
}
$("scrub").addEventListener("input",e=>setOffset(+e.target.value));
document.querySelectorAll(".steps button[data-step]").forEach(b=>
  b.addEventListener("click",()=>setOffset(offset+ +b.dataset.step)));
function goLive(){ mode="live"; offset=0; render(); }
$("nowbtn").addEventListener("click",goLive);
$("nowchip").addEventListener("click",goLive);

/* drag on the reference card */
(function(){
  const card=$("refcard"); let active=false, startX=0, startOff=0;
  const MIN_PER_PX=3;
  card.addEventListener("pointerdown",e=>{active=true;startX=e.clientX;startOff=offset;card.setPointerCapture(e.pointerId);});
  card.addEventListener("pointermove",e=>{ if(!active)return;
    setOffset(startOff + (e.clientX-startX)*MIN_PER_PX); });
  card.addEventListener("pointerup",()=>active=false);
  card.addEventListener("pointercancel",()=>active=false);
})();

/* ---------- Edit mode ---------- */
$("editBtn").addEventListener("click",()=>{
  document.body.classList.toggle("editing");
  $("editBtn").textContent=document.body.classList.contains("editing")?"Done":"Edit";
});
$("rows").addEventListener("click",e=>{
  const b=e.target.closest(".del"); if(!b)return;
  myTZs=myTZs.filter(t=>t!==b.dataset.tz); if(!myTZs.length)myTZs=["UTC"];
  save(); render();
});

/* ---------- Add city sheet ---------- */
function openSheet(id){ $(id).classList.add("open"); }
function closeSheets(){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheets));
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)closeSheets();}));

$("addBtn").addEventListener("click",()=>{ $("search").value=""; renderSearch(""); openSheet("addSheet"); $("search").focus(); });
$("search").addEventListener("input",e=>renderSearch(e.target.value));
function renderSearch(q){
  q=q.trim().toLowerCase();
  const box=$("searchResults"); box.innerHTML="";
  const list=ZONES.filter(z=>!q|| z[0].toLowerCase().includes(q)||z[1].toLowerCase().includes(q)||z[2].toLowerCase().includes(q)).slice(0,40);
  if(!list.length){ box.innerHTML='<div class="opt"><span class="os">No match. Try a bigger nearby city.</span></div>'; return; }
  list.forEach(z=>{
    const el=document.createElement("div"); el.className="opt";
    const added=myTZs.includes(z[2]);
    el.innerHTML='<div><div class="oc">'+z[0]+(added?' ✓':'')+'</div><div class="os">'+z[1]+'</div></div><div class="oz">'+z[2].split("/").pop().replace(/_/g," ")+'</div>';
    el.addEventListener("click",()=>{
      if(!myTZs.includes(z[2])){ myTZs.push(z[2]); save(); render(); }
      renderSearch($("search").value);
    });
    box.appendChild(el);
  });
}

/* ---------- Converter sheet ---------- */
function fillSelect(sel,current){
  sel.innerHTML="";
  ZONES.forEach(z=>{ const o=document.createElement("option");
    o.value=z[2]; o.textContent=z[0]+" — "+z[1]; if(z[2]===current)o.selected=true; sel.appendChild(o);});
}
let convFrom="Asia/Seoul", convTo="America/New_York";
$("convBtn").addEventListener("click",()=>{
  fillSelect($("cFrom"),convFrom); fillSelect($("cTo"),convTo);
  const n=new Date();
  const p=partsIn(n,convFrom);
  const mi=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(p.month)+1;
  $("cDate").value=p.year+"-"+String(mi).padStart(2,"0")+"-"+String(p.day).padStart(2,"0");
  $("cTime").value=String(p.hour).padStart(2,"0")+":"+p.minute;
  convCalc(); openSheet("convSheet");
});
["cFrom","cTo","cDate","cTime"].forEach(id=>$(id).addEventListener("input",convCalc));
let lastInstant=null;
function convCalc(){
  const from=$("cFrom").value, to=$("cTo").value;
  convFrom=from; convTo=to;
  const dv=$("cDate").value, tv=$("cTime").value;
  if(!dv||!tv){ $("cResult").textContent="—"; return; }
  const [y,mo,d]=dv.split("-").map(Number);
  const [h,mi]=tv.split(":").map(Number);
  const ts=wallToInstant(y,mo,d,h,mi,from);
  lastInstant=ts;
  const p=partsIn(new Date(ts),to);
  $("cResult").textContent=String(p.hour).padStart(2,"0")+":"+p.minute;
  $("cResultLbl").textContent=p.weekday+", "+p.month+" "+p.day+" "+p.year+" · "+cityName(to)+" ("+zoneAbbr(ts,to)+")";
  const pf=partsIn(new Date(ts),from);
  $("cFromLbl").textContent="From "+cityName(from)+": "+pf.weekday+" "+pf.month+" "+pf.day+", "+String(pf.hour).padStart(2,"0")+":"+pf.minute+" ("+zoneAbbr(ts,from)+")";
}
$("cSend").addEventListener("click",()=>{
  if(lastInstant==null) return;
  if(!myTZs.includes(convTo)){ myTZs.push(convTo); save(); }
  mode="fixed"; fixedBase=lastInstant; offset=0;
  closeSheets(); render();
});

/* ---------- Boot + live tick ---------- */
render();
setInterval(()=>{ if(mode==="live") render(); },1000);
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
